; HVprog2: ATmega32, external 7.3728 MHz, standard pinout.
[platformio]
src_dir = .
packages_dir = .pio/packages
default_envs = hvprog2

[env:hvprog2]
platform = platformio/atmelavr@5.1.0
framework = arduino
platform_packages =
    platformio/framework-arduino-avr-mightycore@3.0.2
board = ATmega32
board_build.f_cpu = 7372800L
board_build.variant = standard
build_src_filter =
    +<SMo*.cpp>
    +<ScratchMonkey.ino.cpp>
monitor_speed = 115200
; Configure the actual external ISP programmer before enabling upload.
upload_protocol = custom
